<!DOCTYPE html>
<html lang="ru" data-theme="dark" data-color="green">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>K — Kukumber Messenger</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="https://ltdfoto.ru/images/2026/08/22/image7467a87cb994e0f3.png" />
<link rel="apple-touch-icon" href="https://ltdfoto.ru/images/2026/08/22/image7467a87cb994e0f3.png" />
<meta name="theme-color" content="#0e1116" />
<link rel="stylesheet" href="css/themes.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ================= AUTH ================= -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="https://ltdfoto.ru/images/2026/08/22/image7467a87cb994e0f3.png" alt="K" />
      <span>K</span>
    </div>

    <div class="auth-tabs">
      <button id="tab-login" class="active">Войти</button>
      <button id="tab-register">Регистрация</button>
    </div>

    <!-- LOGIN -->
    <div id="step-login" class="auth-step active">
      <div class="field"><label>Email</label><input type="email" id="login-email" autocomplete="email" /></div>
      <div class="field"><label>Пароль</label><input type="password" id="login-password" autocomplete="current-password" /></div>
      <button class="btn-primary" id="btn-login">Войти</button>
      <div class="auth-error" id="login-error"></div>
      <a class="btn-link" id="link-forgot">Забыли пароль?</a>
      <div style="display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--text-dim);font-size:12px;">
        <div style="flex:1;height:1px;background:var(--border);"></div>или<div style="flex:1;height:1px;background:var(--border);"></div>
      </div>
      <button class="btn-primary" id="btn-google" style="background:var(--surface-2);color:var(--text);display:flex;align-items:center;justify-content:center;gap:10px;">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.91c1.7-1.57 2.69-3.88 2.69-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.27c-.81.54-1.84.86-3.05.86-2.35 0-4.34-1.58-5.05-3.71H.96v2.33C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.95 10.71c-.18-.54-.29-1.11-.29-1.71s.11-1.17.29-1.71V4.96H.96C.35 6.18 0 7.55 0 9s.35 2.82.96 4.04l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.96l2.99 2.33C4.66 5.16 6.65 3.58 9 3.58z"/></svg>
        Войти через Google
      </button>
    </div>

    <!-- REGISTER -->
    <div id="step-register" class="auth-step">
      <div class="field"><label>Имя</label><input type="text" id="reg-name" /></div>
      <div class="field"><label>@username</label><input type="text" id="reg-username" placeholder="ivan_petrov" /></div>
      <div class="field"><label>Email</label><input type="email" id="reg-email" /></div>
      <div class="field"><label>Пароль</label><input type="password" id="reg-password" /></div>
      <button class="btn-primary" id="btn-register">Создать аккаунт</button>
      <div class="auth-error" id="register-error"></div>
    </div>

    <!-- FORGOT PASSWORD -->
    <div id="step-forgot" class="auth-step">
      <p style="font-size:13px;color:var(--text-dim);margin-bottom:12px;">
        Укажи email — пришлём ссылку для сброса пароля.
      </p>
      <div class="field"><label>Email</label><input type="email" id="forgot-email" /></div>
      <button class="btn-primary" id="btn-forgot">Отправить</button>
      <div class="auth-error" id="forgot-error"></div>
      <a class="btn-link" id="link-back-login">← Назад ко входу</a>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app-screen" class="hidden">

  <div class="sidebar">
    <img class="sidebar-logo" src="https://ltdfoto.ru/images/2026/08/22/image7467a87cb994e0f3.png" alt="K" />
    <img id="side-avatar" class="side-avatar" src="" alt="Профиль" />

    <button class="side-tab active" data-tab="slices">
      <img class="icon icon--lg" id="icon-tab-slices" src="" alt="Слайсы" />
      <span class="side-tab-label">Slices</span>
    </button>
    <button class="side-tab" data-tab="chats">
      <img class="icon icon--lg" id="icon-tab-chats" src="" alt="Чаты" />
      <span class="side-tab-label">Чаты</span>
      <span class="badge hidden" id="chats-badge">0</span>
    </button>
    <button class="side-tab" data-tab="profile">
      <img class="icon icon--lg" id="icon-tab-profile" src="" alt="Профиль" />
      <span class="side-tab-label">Профиль</span>
    </button>

    <div class="sidebar-spacer"></div>

    <button class="side-tab" data-tab="settings">
      <img class="icon icon--lg" id="icon-tab-settings" src="" alt="Настройки" />
      <span class="side-tab-label">Настройки</span>
    </button>
  </div>

  <div class="main-view">

    <!-- ---- SLICES ---- -->
    <div class="view active" id="view-slices">
      <div class="slices-header">
        <h1>Slices</h1>
        <button class="icon-btn" id="btn-search-slices"><img class="icon" id="icon-search-slices" src="" alt="Поиск" /></button>
      </div>
      <div class="feed" id="feed-container">
        <div class="empty-state">Лента пуста. Опубликуй первый слайс →</div>
      </div>
      <button class="fab" id="fab-new-post">+</button>
    </div>

    <!-- ---- CHATS ---- -->
    <div class="view" id="view-chats">
      <div class="chats-header">
        <h1>Чаты</h1>
        <button class="icon-btn" id="btn-new-chat">
          <span style="font-size:22px;">+</span>
        </button>
      </div>
      <div class="chats-list" id="chats-list">
        <div class="empty-state">Пока нет чатов. Нажми + чтобы начать</div>
      </div>
    </div>

    <!-- ---- PROFILE ---- -->
    <div class="view" id="view-profile">
      <div id="profile-content"></div>
    </div>

    <!-- ---- SETTINGS ---- -->
    <div class="view" id="view-settings">
      <div id="settings-content"></div>
    </div>

  </div>

  <!-- comments overlay -->
  <div id="comments-view"></div>

  <!-- chat window overlay -->
  <div id="chat-window"></div>

  <!-- attach menu -->
  <div class="attach-menu" id="attach-menu"></div>

  <!-- context menu -->
  <div class="ctx-backdrop" id="ctx-backdrop"></div>
  <div class="ctx-menu hidden" id="ctx-menu"></div>

  <!-- new post modal -->
  <div class="modal-backdrop" id="modal-new-post">
    <div class="modal" id="modal-new-post-body"></div>
  </div>

  <!-- new chat / group modal -->
  <div class="modal-backdrop" id="modal-new-chat">
    <div class="modal" id="modal-new-chat-body"></div>
  </div>

  <!-- generic confirm modal -->
  <div class="modal-backdrop" id="modal-confirm">
    <div class="modal" id="modal-confirm-body"></div>
  </div>

  <!-- toast -->
  <div id="toast-root"></div>

</div>

<script type="module" src="js/main.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
